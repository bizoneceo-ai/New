name: Build Nardy APK

on:
  push:
    branches:
      - ccr-c8662bfa-5aq74v
    paths:
      - "nardy/**"
      - ".github/workflows/build-nardy.yml"
  pull_request:
    paths:
      - "nardy/**"
      - ".github/workflows/build-nardy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit / branch to build (empty = this branch)"
        required: false
        default: ""
      release_tag:
        description: "Also keep this build as nardy-<name>.apk, e.g. v1.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nardy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Rules engine tests
        run: ./gradlew :engine:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          if [ -f app/build/outputs/apk/classic/debug/app-classic-debug.apk ]; then
            cp app/build/outputs/apk/classic/debug/app-classic-debug.apk nardy-debug.apk
            cp app/build/outputs/apk/physics/debug/app-physics-debug.apk nardy-3d-debug.apk
          else
            # Versions before the 3D test build had a single flavour.
            cp app/build/outputs/apk/debug/app-debug.apk nardy-debug.apk
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nardy-apk
          path: nardy/nardy-*debug.apk

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Keep a fixed version next to the latest build
        if: inputs.release_tag != ''
        run: cp nardy-debug.apk "nardy-${{ inputs.release_tag }}.apk"

      - name: Publish fixed version
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # New tags cannot be created from CI in this repository, so fixed
          # versions are stored as separately named files in the download release.
          tag_name: nardy-apk-latest
          files: nardy/nardy-${{ inputs.release_tag }}.apk
          make_latest: false

      - name: Publish/refresh download release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nardy-apk-latest
          name: "Нарды (сборка ${{ github.run_number }})"
          body: |
            Автоматическая сборка из ветки `${{ github.ref_name }}`.

            * `nardy-debug.apk` — основная версия (игра вдвоём и против ИИ);
            * `nardy-3d-debug.apk` — тестовая сборка «Нарды 3D»: объёмные фишки с физикой,
              реагируют на наклон и встряхивание телефона. Ставится рядом с основной;
            * `nardy-v1.0.apk` — зафиксированная версия 1.0.

            Разрешите установку из неизвестных источников при первом запросе.
          files: nardy/nardy-*debug.apk
          make_latest: false
