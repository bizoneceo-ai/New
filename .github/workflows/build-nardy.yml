name: Build Nardy APK

on:
  push:
    branches:
      - ccr-c8662bfa-5aq74v
    paths:
      - "nardy/**"
      - ".github/workflows/build-nardy.yml"
  pull_request:
    paths:
      - "nardy/**"
      - ".github/workflows/build-nardy.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nardy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Rules engine tests
        run: ./gradlew :engine:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nardy-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nardy-apk
          path: nardy/nardy-debug.apk

      - name: Publish/refresh download release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nardy-apk-latest
          name: "Нарды (сборка ${{ github.run_number }})"
          body: |
            Автоматическая сборка debug-APK из ветки `${{ github.ref_name }}`.
            Скачайте `nardy-debug.apk` ниже и установите на телефоне
            (разрешите установку из неизвестных источников при первом запросе).
          files: nardy/nardy-debug.apk
          make_latest: false
