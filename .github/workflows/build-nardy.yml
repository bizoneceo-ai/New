name: Build Nardy APK

on:
  push:
    branches:
      - ccr-c8662bfa-5aq74v
    paths:
      - "nardy/**"
      - ".github/workflows/build-nardy.yml"
  pull_request:
    paths:
      - "nardy/**"
      - ".github/workflows/build-nardy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit / branch to build (empty = this branch)"
        required: false
        default: ""
      release_tag:
        description: "Also publish a fixed release under this tag, e.g. nardy-v1.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nardy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Rules engine tests
        run: ./gradlew :engine:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nardy-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nardy-apk
          path: nardy/nardy-debug.apk

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish fixed version release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: "Нарды ${{ inputs.release_tag }}"
          body: |
            Зафиксированная версия, собрана из коммита ${{ steps.commit.outputs.sha }}.
            Скачайте APK ниже и установите на телефоне.
          files: nardy/*.apk
          make_latest: false

      - name: Publish/refresh download release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nardy-apk-latest
          name: "Нарды (сборка ${{ github.run_number }})"
          body: |
            Автоматическая сборка debug-APK из ветки `${{ github.ref_name }}`.
            Скачайте `nardy-debug.apk` ниже и установите на телефоне
            (разрешите установку из неизвестных источников при первом запросе).
          files: nardy/nardy-debug.apk
          make_latest: false
